name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1, no leading v)'
        required: true

permissions:
  contents: write

jobs:
  # ── Resolve the version/tag once, regardless of trigger ──────────────────
  # A tag push already carries the version in github.ref_name; a manual
  # workflow_dispatch run instead carries it in the version input. Every
  # other job reads from here so neither trigger needs special-casing
  # downstream.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Resolve version and tag
        id: vars
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then
            RAW="${{ github.ref_name }}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  # ── Raw binaries (amd64 + arm64) ─────────────────────────────────────────
  binary:
    name: Build binary linux/${{ matrix.goarch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev build-essential nasm pkg-config curl xz-utils

      # Build a minimal, static FFmpeg (native arch) so the released raw binary
      # carries no FFmpeg runtime dependency and is portable across distros —
      # matching the .deb/.rpm/docker artifacts. Installs to
      # /tmp/gotidal-ffmpeg-static, which internal/player/avcodec_static.go
      # links against under -tags staticav.
      - name: Build static FFmpeg
        run: bash packaging/build-static-ffmpeg.sh /tmp/gotidal-ffmpeg-static

      - name: Build
        run: go build -tags staticav -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.tag }}" -o gotidal-linux-${{ matrix.goarch }} ./cmd/gotidal

      - uses: actions/upload-artifact@v5
        with:
          name: gotidal-linux-${{ matrix.goarch }}
          path: gotidal-linux-${{ matrix.goarch }}

  # ── Docker image (carcuevas/gotidal) ───────────────────────────────────────
  docker:
    name: Push Docker image
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: carcuevas
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          DOCKER_TAG="${{ needs.prepare.outputs.tag }}" docker buildx bake docker \
            --file docker-bake.hcl \
            --set "*.args.VERSION=${{ needs.prepare.outputs.version }}" \
            --push

  # ── Distro packages via docker bake ──────────────────────────────────────
  packages:
    name: Build distro packages
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: carcuevas
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build packages
        run: |
          docker buildx bake \
            --file docker-bake.hcl \
            --set "*.args.VERSION=${{ needs.prepare.outputs.version }}" \
            --set "*.output=type=local,dest=dist"

      - name: Flatten platform subdirectories
        run: find dist -mindepth 2 -type f -exec mv {} dist/ \; && find dist -type d -empty -delete

      - uses: actions/upload-artifact@v5
        with:
          name: distro-packages
          path: dist/

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [prepare, binary, packages, docker]

    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Build release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGELOG=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            --method POST \
            --field tag_name=${{ needs.prepare.outputs.tag }} \
            --jq '.body')

          printf '%s\n' '## Checksums (SHA-256)' > release_body.md
          printf '%s\n' '' >> release_body.md
          printf '%s\n' 'Verify all downloaded files at once:' >> release_body.md
          printf '%s\n' '' >> release_body.md
          printf '%s\n' '```bash' >> release_body.md
          printf '%s\n' 'sha256sum -c checksums.txt' >> release_body.md
          printf '%s\n' '```' >> release_body.md
          printf '%s\n' '' >> release_body.md
          printf '%s\n' 'Or check a single file:' >> release_body.md
          printf '%s\n' '' >> release_body.md
          printf '%s\n' '```bash' >> release_body.md
          printf '%s\n' 'sha256sum --ignore-missing -c checksums.txt' >> release_body.md
          printf '%s\n' '```' >> release_body.md
          printf '%s\n' '' >> release_body.md
          printf '%s\n' '```' >> release_body.md
          cat dist/checksums.txt >> release_body.md
          printf '%s\n' '```' >> release_body.md
          printf '%s\n' '' >> release_body.md
          printf '%s\n' '---' >> release_body.md
          printf '%s\n' '' >> release_body.md
          printf '%s' "$CHANGELOG" >> release_body.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: release_body.md
